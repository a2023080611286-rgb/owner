<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>甕裡乾坤｜鹹菜文創商店</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#2d5a47;--ink:#f1f7f3;--sub:#cfe0d6;--card:#3a6b56;--line:#52836d;--brand:#a8e6c5;--onbrand:#12301f;--gold:#e0a82e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#2d5a47;scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC",serif;margin:0;line-height:1.3}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font:900 20px "Noto Serif TC",serif;letter-spacing:.08em}
.cartbtn{background:var(--brand);color:var(--onbrand);border:0;border-radius:999px;padding:8px 18px;font:500 15px inherit;font-family:inherit;cursor:pointer}
.cartbtn b{background:var(--gold);color:#1d2b24;border-radius:999px;padding:0 8px;margin-left:6px;font-weight:500}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{max-width:1080px;margin:0 auto;padding:56px 20px 28px}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:.04em}
.hero p{max-width:34em;color:var(--sub);margin:14px 0 0}
.grid{max-width:1080px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{--ink:#1d2b24;--sub:#4a5f53;--brand:#1f5c43;--onbrand:#fff;background:#e4f1e8;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{display:block;width:100%;height:auto;aspect-ratio:11/6;object-fit:cover;background:var(--line)}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:17px;font-weight:600;color:#000}
.info p{margin:0;font-size:14px;color:var(--sub);flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.price{font:600 18px "Noto Serif TC",serif;color:#000}
.add{background:transparent;color:var(--brand);border:1.5px solid var(--brand);border-radius:6px;padding:6px 14px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.add:hover{background:var(--brand);color:var(--onbrand)}
footer{text-align:center;color:var(--sub);font-size:14px;padding:30px 20px}footer p{margin:4px 0}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#shade.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ah h2{font-size:20px}
.x{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer;line-height:1}
#items{flex:1;overflow-y:auto}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.it small{color:var(--sub);display:block}
.q{display:flex;align-items:center;gap:6px;margin-top:4px}
.q button{width:26px;height:26px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:5px;cursor:pointer;font-size:16px;line-height:1}
.del{background:none;border:0;color:var(--sub);cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.sum{border-top:2px solid var(--ink);padding-top:12px}
.sum div{display:flex;justify-content:space-between;margin-bottom:4px}
.sum .t{font:600 20px "Noto Serif TC",serif}
.pay{width:100%;margin-top:10px;background:var(--brand);color:var(--onbrand);border:0;border-radius:8px;padding:12px;font:500 16px inherit;font-family:inherit;cursor:pointer}
.pay:disabled{opacity:.4;cursor:not-allowed}
#msg{font-size:13px;color:var(--sub);margin-top:8px;min-height:1.4em}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span class="logo">甕裡乾坤</span><button class="cartbtn" id="open" aria-label="開啟購物車">購物車<b id="cnt">0</b></button></header>
<section class="hero"><h1>鹹菜，慢慢入味</h1><p>從菜脯、酸菜到梅干菜，把家家戶戶甕裡的味道，做成可以收藏、送禮、日日使用的小物。</p></section>
<main class="grid" id="grid"></main>
<footer><p>地址：台中市西區甕香街 18 號</p><p>電話：04-0000-0000</p><p>示範網站，商品與付款流程僅供展示。滿 NT$1,000 免運。</p></footer>

  $('items').innerHTML=ids.length?ids.map(function(k){var x=P[k],q=cart[k];n+=q;sub+=q*x.p;return '<div class="it">'+I(k)+'<div>'+x.n+'<small>'+money(x.p)+'</small><div class="q"><button data-dec="'+k+'" aria-label="減少">−</button><span>'+q+'</span><button data-inc="'+k+'" aria-label="增加">＋</button></div></div><button class="del" data-del="'+k+'">移除</button></div>'}).join(''):'<div class="empty">購物車是空的，先挑一罐喜歡的鹹菜小物吧。</div>';
  var ship=sub===0?0:(sub>=1000?0:80);
  $('cnt').textContent=n;$('sub').textContent=money(sub);$('ship').textContent=sub===0?'—':(ship?money(ship):'免運');$('tot').textContent=money(sub+ship);
  $('pay').disabled=!n;
}
function openCart(o){$('cart').classList.toggle('on',o);$('shade').classList.toggle('on',o);if(o)$('close').focus();else $('open').focus()}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var d=t.dataset;
  if(d.add!==undefined){cart[d.add]=(cart[d.add]||0)+1;toast('已加入：'+P[d.add].n)}
  else if(d.inc!==undefined)cart[d.inc]++;
  else if(d.dec!==undefined){cart[d.dec]--;if(cart[d.dec]<1)delete cart[d.dec]}
  else if(d.del!==undefined)delete cart[d.del];
  else return;
  save();render();
});
$('open').onclick=function(){openCart(true)};
$('close').onclick=function(){openCart(false)};
$('shade').onclick=function(){openCart(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')openCart(false)});
$('pay').onclick=function(){$('msg').textContent='這是示範網站，尚未串接金流。正式上線時可在此接上付款服務。'};
render();
</script>
</body>
</html>
